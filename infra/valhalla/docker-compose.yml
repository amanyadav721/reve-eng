# Our own routing server: Valhalla on OpenStreetMap roads for the launch cities, from Geofabrik's
# India zones: northern (Jaipur, Udaipur), central (Varanasi, Rishikesh) and western (Goa).
# Car ("auto"), scooter and walking in one server.
#   docker-compose -f infra/valhalla/docker-compose.yml up -d   (or "docker compose" with the plugin)
# First start downloads the extracts (~760 MB) and builds routing tiles (20-40 minutes).
# The API reaches it at VALHALLA_URL=http://localhost:8002.
services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: tagalong-valhalla
    ports:
      - "8002:8002"
    volumes:
      - ../../.data/valhalla:/custom_files
    environment:
      - tile_urls=https://download.geofabrik.de/asia/india/northern-zone-latest.osm.pbf https://download.geofabrik.de/asia/india/central-zone-latest.osm.pbf https://download.geofabrik.de/asia/india/western-zone-latest.osm.pbf
      - serve_tiles=True
      - build_admins=True
      - build_time_zones=True
      - build_elevation=False
      - server_threads=4
    restart: unless-stopped
